<div class="parent-container">
  <button class="kosarica" cButton (click)="toggleModal()" color=" ">
    <c-badge class="badge-position" color="danger" shape="rounded-pill">{{ kosarica.ukupnoKomada }}</c-badge>
    <span class="visually-hidden">broj artikala</span>
    <img src="assets/images/cart.png" alt="cart">
  </button>
  <c-modal id="liveDemoModal" [visible]="visible" (visibleChange)="handleLiveDemoChange($event)">
    <c-modal-header>
      <h5 cModalTitle>Pregled košarice</h5>
      <button (click)="toggleModal()" cButtonClose></button>
    </c-modal-header>
    <c-modal-body>
      <p class="text-success" *ngIf="porukaNarudzbe">{{ porukaNarudzbe }}</p>
      <p *ngIf="kosarica.stavke.length === 0 && !porukaNarudzbe">Košarica je prazna.</p>

      <ul class="list-group list-group-light" *ngIf="kosarica.stavke.length > 0">
        <li class="list-group-item d-flex justify-content-between align-items-center" *ngFor="let stavka of kosarica.stavke">
          <div class="d-flex align-items-center">
            <img [src]="slika(stavka.naziv)" [alt]="stavka.naziv" style="width: 65px; height: 55px; object-fit: cover;" />
            <div class="ms-4">
              <p class="fw-bold mb-1">{{ stavka.naziv }}</p>
              <p class="text-body-secondary mb-0">{{ stavka.cijena | number:'1.2-2' }} €</p>
            </div>
          </div>
          <div class="d-flex align-items-center">
            <button class="btn btn-outline-secondary btn-sm me-2" (click)="kosarica.promijeniKolicinu(stavka.idartikl, -1)">-</button>
            <c-badge color="secondary">{{ stavka.kolicina }}</c-badge>
            <button class="btn btn-outline-secondary btn-sm ms-2" (click)="kosarica.promijeniKolicinu(stavka.idartikl, 1)">+</button>
          </div>
        </li>
      </ul>

      <p class="fw-bold text-end mt-3 mb-0" *ngIf="kosarica.stavke.length > 0">
        Ukupno: {{ kosarica.ukupnaCijena | number:'1.2-2' }} €
      </p>
      <p class="text-danger mt-2 mb-0" *ngIf="greskaNarudzbe">{{ greskaNarudzbe }}</p>
    </c-modal-body>
    <c-modal-footer>
      <button (click)="toggleModal()" cButton color="secondary">Zatvori</button>
      <button cButton color="primary" (click)="naruci()" [disabled]="kosarica.stavke.length === 0 || saljeSe">
        Potvrdi narudžbu
      </button>
    </c-modal-footer>
  </c-modal>
</div>
<br>
<c-row>
  <c-col xs="12" sm="6" lg="4" class="mb-4" *ngFor="let a of artikli">
    <c-card class="h-100">
      <img cCardImg="top" class="slika-artikla" [src]="slika(a.naziv)" [alt]="a.naziv">
      <c-card-body>
        <h5 cCardTitle>{{ a.naziv }}</h5>
        <p class="text-center text-body-secondary">{{ a.cijena | number:'1.2-2' }} €</p>
        <div style="display: flex; justify-content: center;">
        <button cButton color="dark" variant="outline" (click)="dodajUKosaricu(a)">Dodaj</button>
        </div>
      </c-card-body>
    </c-card>
  </c-col>
</c-row>
